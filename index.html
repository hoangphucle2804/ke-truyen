<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kệ Truyện">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Kệ Truyện</title>
<style>
/* Layout: kệ sách dạng lưới 2–4 cột; trình đọc toàn màn hình, thanh trên/dưới ẩn hiện khi chạm */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#161a22; --muted:#5d6676; --line:#dde1e8;
  --accent:#2457d6; --accent-ink:#ffffff; --danger:#c2352b; --shade:rgba(10,14,22,.45);
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-serif:"New York",ui-serif,Georgia,"Times New Roman",serif;
  --f-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --surface:#181b22; --ink:#e8ebf1; --muted:#9099a8; --line:#2a2f3a;
    --accent:#7da2ff; --accent-ink:#0f1115; --danger:#ff7b70; --shade:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b22; --ink:#e8ebf1; --muted:#9099a8; --line:#2a2f3a;
  --accent:#7da2ff; --accent-ink:#0f1115; --danger:#ff7b70; --shade:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;overflow-anchor:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}

/* ---------- Kệ sách ---------- */
body.in-lib::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.lib-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid transparent}
.lib-head.scrolled{border-bottom-color:var(--line)}
.lib-head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-size:26px;font-weight:750;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-weight:600;font-size:15px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn svg{width:18px;height:18px}
main.lib{padding-block:8px 48px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0 18px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
.note button{margin-left:auto;color:var(--muted);font-size:20px;line-height:1;padding:0 2px}
.section-label{font-size:12px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 12px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 14px}
.card{position:relative;display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left}
.cover{position:relative;aspect-ratio:3/4;width:100%;max-width:100%;border-radius:8px;overflow:hidden;background:var(--line);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px -8px rgba(0,0,0,.35)}
.cover img{width:100%;height:100%;object-fit:cover;object-position:top}
.cover.gen{display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px;background:linear-gradient(160deg,var(--c1),var(--c2));color:#fff}
.cover.gen b{font-size:16px;line-height:1.2;font-weight:700;text-wrap:balance;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.cover.gen small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.cover .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.35)}
.cover .bar i{display:block;height:100%;background:var(--accent)}
.card-title{font-weight:650;font-size:14.5px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.card-meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-more{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center}
.card-more svg{width:18px;height:18px}
.empty{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);max-width:640px;padding-top:12px}
.empty h2{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.empty p{margin:0;color:var(--muted)}
.steps{display:grid;gap:10px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:13px;display:grid;place-items:center}
.row{display:flex;flex-wrap:wrap;gap:10px}
.formats{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.storage{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;font-variant-numeric:tabular-nums}

/* ---------- Trình đọc ---------- */
body.reading{background:var(--rbg,#000);color:var(--rink,#e9e9e9);
  --rchip:color-mix(in srgb,var(--rbg) 90%,var(--rink));--rline:color-mix(in srgb,var(--rink) 14%,transparent)}
html.paged,html.paged body{overflow:hidden;height:100%;overscroll-behavior:none}
.flow{max-width:820px;margin:0 auto;min-height:100vh;overflow-anchor:none}
.chap-label{color:var(--rmuted);font-family:var(--f-ui);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 68px) 16px 14px}
.chap + .chap .chap-label{padding-top:40px}
.chap.comic img{display:block;width:100%;max-width:100%;height:auto;background:#15161a}
.chap.comic + .chap.comic .chap-label{padding-top:28px}
.chap.text{color:var(--rink);font-family:var(--rf,var(--f-serif));font-size:var(--fs,19px);line-height:var(--lh,1.7);font-weight:var(--fw,400);
  letter-spacing:var(--ls,0);word-spacing:var(--ws,0);text-align:var(--ta,start);-webkit-hyphens:auto;hyphens:auto;
  padding:0 max(var(--mg,20px), env(safe-area-inset-right, 0px)) 36px max(var(--mg,20px), env(safe-area-inset-left, 0px));overflow-wrap:break-word}
.chap.text .content{max-width:38em;margin:0 auto}
.chap.text p{margin:0 0 .85em}
.chap.text h1,.chap.text h2,.chap.text h3{line-height:1.3;text-wrap:balance;margin:1.2em 0 .8em;font-size:1.25em;font-weight:700;text-align:start}
.chap.text img{max-width:100%;height:auto;display:block;margin:1em auto}
.chap.text a{color:inherit}
.chap.text .verse p{margin:0}
.flow-end{color:var(--rmuted);text-align:center;font-size:14px;padding:48px 16px calc(env(safe-area-inset-bottom,0px) + 110px)}

/* Chế độ lật trang: mỗi chương là một khối nhiều cột, mỗi cột rộng đúng một màn hình */
.pager{position:fixed;inset:0;background:var(--rbg);color:var(--rink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pg-head,.pg-foot{position:absolute;left:0;right:0;text-align:center;font:500 12.5px/1.2 var(--f-ui);color:var(--rmuted);padding:0 72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.pg-head{top:calc(env(safe-area-inset-top,0px) + 16px)}
.pg-foot{bottom:calc(env(safe-area-inset-bottom,0px) + 14px)}
.pg-view{position:absolute;left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);top:calc(env(safe-area-inset-top,0px) + 46px);bottom:calc(env(safe-area-inset-bottom,0px) + 44px);overflow:hidden;touch-action:none}
.pg-track{position:absolute;inset:0;will-change:transform}
.pager .chap.pg-chap{position:absolute;top:0;padding:0;column-fill:auto}
.pager .chap-label{padding:0 0 1.4em}
.pager .chap.text .content{max-width:none}
.pager .chap img{max-height:var(--pgh,80vh);width:auto;max-width:100%;margin:0 auto .8em;break-inside:avoid;object-fit:contain;display:block}

/* Nút nổi trên/dưới */
.rc-top,.rc-bot{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;transition:opacity .2s ease,transform .22s ease;pointer-events:none}
.rc-top>*,.rc-bot>*{pointer-events:auto}
.rc-top{top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gutter-r) 18px var(--gutter-l);background:linear-gradient(var(--rbg) 55%,transparent)}
.rc-bot{bottom:0;padding:18px var(--gutter-r) calc(env(safe-area-inset-bottom,0px) + 10px) var(--gutter-l);background:linear-gradient(transparent,var(--rbg) 45%)}
#reader.chrome-off .rc-top{opacity:0;transform:translateY(-12px)}
#reader.chrome-off .rc-bot{opacity:0;transform:translateY(12px)}
#reader.chrome-off .rc-top>*,#reader.chrome-off .rc-bot>*{pointer-events:none}
.rc-label{flex:1;min-width:0;text-align:center;font-size:14.5px;font-weight:500;color:var(--rmuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.rbtn{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--rchip);color:var(--rink);border:1px solid var(--rline);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.rbtn svg{width:22px;height:22px}
.rbtn.aa{font-family:Georgia,serif;font-size:18px;font-weight:600}
.scrub{flex:1;min-width:0;display:grid;gap:0;justify-items:center}
.scrub input{width:min(100%,440px)}
.scrub-txt{font-size:13px;color:var(--rmuted);font-variant-numeric:tabular-nums;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:95}

/* Thanh trượt */
.rg{-webkit-appearance:none;appearance:none;width:100%;height:30px;margin:0;background:transparent;--on:var(--rink);--off:color-mix(in srgb,var(--rink) 18%,transparent)}
.rg::-webkit-slider-runnable-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--on) var(--fill,0%),var(--off) var(--fill,0%))}
.rg::-moz-range-track{height:6px;border-radius:99px;background:linear-gradient(to right,var(--on) var(--fill,0%),var(--off) var(--fill,0%))}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-10px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.rg::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.rg:disabled{opacity:.35}
.rs-panel .rg{--on:var(--rs-ink);--off:var(--rs-track)}

/* Menu “…” */
.rmenu{position:fixed;right:var(--gutter-r);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);z-index:30;min-width:244px;background:var(--rs-card);color:var(--rs-ink);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28);padding:6px;display:grid;font-family:var(--f-ui)}
.rmenu button{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px;border-radius:10px;font-size:16px;text-align:left}
.rmenu button:disabled{opacity:.35}
.rmenu .mi{width:22px;display:grid;place-items:center}
.rmenu .mi svg{width:20px;height:20px}
.mi-aa{font-family:Georgia,serif;font-size:15px}

/* Bảng Giao diện & Cài đặt */
.rs-wrap{position:fixed;inset:0;z-index:55;display:flex;align-items:flex-end;justify-content:center;padding:0 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.rs-panel{position:relative;width:100%;max-width:470px;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--rs-bg);color:var(--rs-ink);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:30px;padding:16px 16px 18px;box-shadow:0 12px 50px rgba(0,0,0,.3);font-family:var(--f-ui);display:grid;gap:14px;animation:rs-in .22s ease}
@keyframes rs-in{from{transform:translateY(24px);opacity:0}}
.rs-head{display:flex;align-items:center;gap:14px}
.rs-head h3{margin:0;font-size:18px;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--rs-card);color:var(--rs-ink);border:1px solid var(--rs-line);flex:none}
.rs-x svg{width:20px;height:20px}
.rs-x.ok{background:var(--rs-ink);color:var(--rs-okink);border-color:transparent}
.rs-row{display:grid;grid-template-columns:1.55fr 1fr;gap:10px}
.pill{display:flex;align-items:stretch;height:50px;background:var(--rs-card);border-radius:999px;overflow:hidden}
.pill button{flex:1;display:grid;place-items:center}
.pill button+button{border-left:1px solid var(--rs-line)}
.pill svg{width:24px;height:24px}
.a-sm{font-size:16px;font-weight:600}
.a-lg{font-size:25px;font-weight:600}
.rs-bright{display:flex;align-items:center;gap:12px;padding:0 4px}
.rs-bright svg{width:17px;height:17px}
.rs-bright .big svg{width:25px;height:25px}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{position:relative;height:88px;border-radius:18px;display:grid;align-content:center;justify-items:center;gap:2px;background:var(--tbg);color:var(--tink);border:1px solid var(--rs-line);overflow:hidden}
.tcard b{font-size:33px;line-height:1.05;font-weight:inherit}
.tcard span{font-size:14.5px}
.tcard.on{box-shadow:inset 0 0 0 3px var(--rs-ink)}
.tcard sup{position:absolute;top:9px;right:12px;font-size:16px;line-height:1}
.rs-wide{height:52px;border-radius:999px;background:var(--rs-card);display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:600}
.rs-wide svg{width:22px;height:22px}
.rs-pop{position:absolute;z-index:3;min-width:236px;background:var(--rs-card);color:var(--rs-ink);border-radius:14px;box-shadow:0 10px 36px rgba(0,0,0,.28);padding:6px;display:grid}
.rs-pop button{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:9px;font-size:15.5px;text-align:left}
.rs-pop .ck{width:20px;flex:none}
.rs-pop .ck svg,.rs-item .ck svg{width:18px;height:18px}
.rs-top{margin:-16px -16px 0;padding:16px 0 20px;background:var(--rbg);color:var(--rink);border-bottom:1px solid var(--rs-line)}
.rs-top .rs-head{padding:0 16px}
.pv{padding:0 var(--mg)}
.pv-aa{font-family:var(--rf);font-weight:var(--fw);font-size:44px;line-height:1.1;margin:12px 0 6px}
.pv-text{margin:0;font-family:var(--rf);font-size:var(--fs);line-height:var(--lh);font-weight:var(--fw);letter-spacing:var(--ls);word-spacing:var(--ws);text-align:var(--ta);max-height:calc(var(--fs) * var(--lh) * 3);overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.rs-sec h4{margin:4px 4px 8px;font-size:19px;font-weight:700}
.rs-group{background:var(--rs-card);border-radius:18px;padding:0 16px}
.rs-group > * + *{border-top:1px solid var(--rs-line)}
.rs-item{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;text-align:left;font-size:16.5px}
.rs-item > span:first-child:not(.ic),.rs-item .ic + span{flex:1;min-width:0}
.rs-item .ic{width:24px;text-align:center;font-family:Georgia,serif;font-size:17px}
.rs-item .v{color:var(--rs-muted);font-size:17px}
.rs-item .chev svg{width:15px;height:15px;color:var(--rs-muted)}
.rs-item .ck{width:20px;flex:none}
.sl{padding:12px 0 8px}
.sl-label{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--rs-muted);margin-bottom:2px}
.sl-row{display:flex;align-items:center;gap:14px}
.sl-val{min-width:58px;text-align:right;color:var(--rs-muted);font-size:16px;font-variant-numeric:tabular-nums}
.rs-group.off .sl,.rs-group.off .rs-item:last-child{opacity:.45}
.sw{width:52px;height:32px;border-radius:99px;background:var(--rs-track);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}
.rs-link{color:var(--rs-muted);font-size:15px;justify-self:center;padding:6px 10px}
.rs-note{margin:0 4px;color:var(--rs-muted);font-size:13px}

/* ---------- Bảng trượt, lớp phủ, thông báo ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:var(--shade);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:86%;display:flex;flex-direction:column;background:var(--surface);color:var(--ink);border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px var(--gutter-r) 10px var(--gutter-l)}
.sheet-head h3{margin:0;font-size:17px}
.sheet-head button{color:var(--muted);font-weight:600}
.sheet-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 var(--gutter-r) 18px var(--gutter-l);display:grid;gap:12px;min-height:0}
.sheet-body p{margin:0;color:var(--muted)}
.sheet-actions{display:grid;gap:8px}
.sheet-actions .btn{width:100%;height:48px;border-radius:12px}
.field{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;padding:0 14px}
.toc{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.toc button{width:100%;text-align:left;padding:12px 12px;border-radius:10px;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.toc button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc button small{color:var(--muted);flex:none}
.toc button.cur{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);font-weight:650}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{min-width:44px;height:34px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.overlay{position:fixed;inset:0;z-index:60;background:var(--shade);display:grid;place-items:center;padding:0 var(--gutter-r) 0 var(--gutter-l)}
.ov-card{width:100%;max-width:380px;background:var(--surface);border-radius:16px;padding:20px;display:grid;gap:10px}

/* ---------------- Đọc file ZIP (EPUB/CBZ) trực tiếp từ Blob ---------------- */
const MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', avif: 'image/avif', svg: 'image/svg+xml', bmp: 'image/bmp' };

/* ---------------- Kích thước ảnh (đọc phần đầu file, không cần giải mã) ---------------- */

/* ---------------- Tên chương, sắp xếp tự nhiên ---------------- */

/* ---------------- Phân tích EPUB / CBZ / TXT ---------------- */
async function parseEpub(zip, fname) {
  const container = await zip.text('META-INF/container.xml');

    const nav = [...byId.values()].find(i => /\bnav\b/.test(i.props));

      const d = parseHtml(await zip.text(nav.href));
      const navEl = [...d.querySelectorAll('nav')].find(n => (n.getAttribute('epub:type') || '').includes('toc')) || d.querySelector('nav');
      for (const a of navEl ? navEl.querySelectorAll('a[href]') : []) { const p = resolvePath(dirOf(nav.href), a.getAttribute('href')); if (p && !toc.has(p)) toc.set(p, a.textContent.replace(/\s+/g, ' ').trim()); }
    }
    if (!toc.size) {
      const ncx = [...byId.values()].find(i => /ncx/.test(i.type));
      if (ncx && zip.has(ncx.href)) {
        const d = parseXml(await zip.text(ncx.href));

  }

}
async function parseCbz(zip, fname) {

function splitText(text, fname) {

  showOverlay(isNew ? 'Đang thêm truyện…' : 'Đang thêm chương…');
  for (let idx = 0; idx < files.length; idx++) {
    const f = files[idx];
    updateOverlay(idx / files.length, `${idx + 1}/${files.length} · ${f.name}`);
    try {
      const ext = extOf(f.name);
      let meta;
      const key = `${book.id}/f${n}`;
      if (ext === 'txt') {
        meta = splitText(decodeText(await f.arrayBuffer()), f.name);
        for (let j = 0; j < meta.chapters.length; j++) {
          const c = meta.chapters[j]; c.type = 'text'; c.textKey = `${key}_t${j}`;
          await Store.putFile(c.textKey, new Blob([c.body], { type: 'text/plain' })); delete c.body;
        }
      } else {
        const zip = await openZip(f);
        meta = ext === 'epub' ? await parseEpub(zip, f.name) : await parseCbz(zip, f.name);
        await Store.putFile(key, new Blob([f], { type: 'application/zip' }));
        if (!coverSource && meta.coverPath && zip.has(meta.coverPath)) coverSource = () => zip.blob(meta.coverPath);
      }
      meta.chapters.forEach((c, j) => { c.id = `c${n}_${j}`; c.file = key; c.src = f.name; c.sub = j; });
      book.files.push({ n, key, name: f.name, size: f.size });
      book.chapters.push(...meta.chapters);
      if (!firstMeta) firstMeta = meta;
      n++; added++;
      if (idx % 8 === 7) await sleep(0);
    } catch (e) { errors.push(`${f.name}: ${e.message || e}`); }
  }
  updateOverlay(1, 'Đang lưu…');
  if (!added) { hideOverlay(); showErrors(errors, 'Không thêm được file nào'); return; }
  book.chapters.sort((a, b) => ncmp(a.src, b.src) || a.sub - b.sub);
  const types = new Set(book.chapters.map(c => c.type));
  book.kind = types.size === 1 && types.has('images') ? 'comic' : types.has('images') ? 'mixed' : 'novel';
  if (isNew) { book.title = guessTitle(files, firstMeta) || 'Truyện mới'; book.author = firstMeta?.creator || ''; }
  if (!book.hasCover && coverSource) { try { const t = await makeThumb(await coverSource()); if (t) { await Store.putFile(`${book.id}/cover`, t); book.hasCover = true; } } catch {} }
  await Store.putBook(book);
  hideOverlay();
  await renderLibrary();
  const msg = `${isNew ? 'Đã thêm' : 'Đã bổ sung'} ${added} file${skipped ? ` (bỏ qua ${skipped} file không hỗ trợ)` : ''}.`;
  if (errors.length) showErrors(errors, msg);
  else if (isNew && files.length > 1 && book.title === 'Truyện mới') renameSheet(book, 'Đặt tên cho bộ truyện');
  else toast(msg);
}

  Object.assign(v, isDark()

darkMQ.addEventListener?.('change', () => { if (R.book && S.appearance === 'auto') keepPlace(applySettings); });

const io = new IntersectionObserver(ents => {
  for (const e of ents) { const img = e.target; if (e.isIntersecting) { if (img.getAttribute('src') !== img.dataset.src) img.src = img.dataset.src; } else if (img.hasAttribute('src')) img.removeAttribute('src'); }
}, { rootMargin: '250% 0px 250% 0px' });

async function zipFor(key) {
  if (!R.zips.has(key)) R.zips.set(key, (async () => { const blob = await Store.file(key); if (!blob) throw new Error('mất dữ liệu file, hãy thêm lại'); return openZip(blob); })());
  try { return await R.zips.get(key); } catch (e) { R.zips.delete(key); throw e; }
}
async function buildSection(i) {
  const ch = R.book.chapters[i], urls = [];
  const sec = el('section', { class: 'chap ' + (ch.type === 'images' ? 'comic' : 'text'), 'data-i': i });
  sec.append(el('div', { class: 'chap-label', text: ch.title }));
  if (ch.type === 'images') {
    const zip = await zipFor(ch.file);
    for (const p of ch.pages) {
      let blob; try { blob = await zip.blob(p); } catch { continue; }
      const url = URL.createObjectURL(blob); urls.push(url);
      const sz = (await imgSize(blob)) || (await sizeByLoad(url));
      const img = el('img', { alt: '', decoding: 'async', width: sz.w, height: sz.h, style: `aspect-ratio:${sz.w}/${sz.h}` });
      img.dataset.src = url; sec.append(img);
    }
  } else if (ch.type === 'text') {
    const blob = await Store.file(ch.textKey);
    const text = blob ? await blob.text() : '';
    const box = el('div', { class: 'content' + (ch.verse ? ' verse' : '') });
    for (const para of text.split(ch.verse ? /\n/ : /\n\s*\n|\n/)) { const t = para.trim(); if (t) box.append(el('p', { text: t })); }
    sec.append(box);
  } else {
    const zip = await zipFor(ch.file);
    const box = el('div', { class: 'content' });
    for (const entry of ch.entries) {
      let html; try { html = await zip.text(entry); } catch { continue; }
      const d = parseHtml(html), body = d.body; if (!body) continue;
      body.querySelectorAll('script,style,link,meta,title,iframe,object,embed,form,input,button,noscript,base,video,audio').forEach(n => n.remove());
      for (const n of body.querySelectorAll('*')) for (const a of [...n.attributes]) if (/^on/i.test(a.name) || a.name === 'style' || a.name === 'srcset') n.removeAttribute(a.name);
      const base = dirOf(entry);
      for (const svg of body.querySelectorAll('svg')) { const im = svg.querySelector('image'); if (im) { const r = d.createElement('img'); r.setAttribute('src', im.getAttribute('xlink:href') || im.getAttribute('href') || ''); svg.replaceWith(r); } }
      for (const img of body.querySelectorAll('img')) {
        const p = resolvePath(base, img.getAttribute('src'));
        if (!p || !zip.has(p)) { img.remove(); continue; }
        const u = URL.createObjectURL(await zip.blob(p)); urls.push(u); img.setAttribute('src', u); img.setAttribute('alt', img.getAttribute('alt') || '');
      }
      for (const a of body.querySelectorAll('a[href]')) { const t = resolvePath(base, a.getAttribute('href')); a.removeAttribute('href'); if (t) { a.dataset.target = t; a.setAttribute('role', 'link'); a.style.textDecoration = 'underline'; } }
      box.append(...[...body.childNodes].map(nd => document.importNode(nd, true)));
    }

  }

}
function attach(s) { for (const img of s.el.querySelectorAll('img[data-src]')) io.observe(img); }
function dispose(s) { for (const img of s.el.querySelectorAll('img[data-src]')) io.unobserve(img); s.urls.forEach(u => URL.revokeObjectURL(u)); s.el.remove(); }
function clearSections() { R.secs.forEach(dispose); R.secs = []; flow.replaceChildren(); }
const absTop = e => e.getBoundingClientRect().top + window.scrollY;
function currentSec() { for (const s of R.secs) { if (s.el.getBoundingClientRect().bottom > 2) return s; } return R.secs[R.secs.length - 1]; }

async function openBook(id) {
  const book = await Store.book(id); if (!book) return;
  R.book = book; R.gen++; R.zips.clear(); R.pos = null;
  document.body.classList.remove('in-lib'); document.body.classList.add('reading');
  $('#lib-view').hidden = true; reader.hidden = false;
  applySettings(); setModeUI(effMode());
  setChrome(true);
  const p = await Store.progress(id);
  const ci = p ? Math.max(0, book.chapters.findIndex(c => c.id === p.chId)) : 0;
  await jumpTo(ci, p ? p.frac || 0 : 0);
  book.lastRead = Date.now(); Store.putBook(book).catch(() => {});
  document.fonts?.ready.then(relayoutSoon);
}

/* ----- Chế độ cuộn dọc ----- */
async function scrollJump(i, frac) {
  const gen = ++R.gen; R.busy = true;
  try {
    clearSections();
    const s = await buildSection(i);
    if (gen !== R.gen) { dispose(s); return; }
    flow.append(s.el); R.secs = [s]; attach(s);
    window.scrollTo(0, absTop(s.el) + frac * s.el.getBoundingClientRect().height);
    R.lastY = window.scrollY;
  } catch (e) { toast('Không mở được chương: ' + (e.message || e)); }
  finally { if (gen === R.gen) R.busy = false; }
  updateBars(); ensure();
}
async function ensure() {
  if (R.busy || !R.book || !R.secs.length || R.mode !== 'scroll') return;
  R.busy = true; const gen = R.gen; let changed = false;
  try {
    const n = R.book.chapters.length, vh = window.innerHeight;
    const first = R.secs[0], last = R.secs[R.secs.length - 1];
    if (document.documentElement.scrollHeight - (window.scrollY + vh) < vh * 2.5 && last.i + 1 < n) {
      const s = await buildSection(last.i + 1); if (gen !== R.gen) { dispose(s); return; }
      flow.append(s.el); R.secs.push(s); attach(s); changed = true;
    } else if (window.scrollY < vh * 1.5 && first.i > 0) {
      const s = await buildSection(first.i - 1); if (gen !== R.gen) { dispose(s); return; }
      const y0 = window.scrollY; flow.prepend(s.el);
      window.scrollTo(0, y0 + s.el.getBoundingClientRect().height);
      R.secs.unshift(s); attach(s); changed = true;
    }
    while (R.secs.length > 4) {
      const ci = (currentSec() || R.secs[0]).i, a = R.secs[0], b = R.secs[R.secs.length - 1];
      if (Math.abs(a.i - ci) >= Math.abs(b.i - ci)) { const h = a.el.getBoundingClientRect().height, y0 = window.scrollY; dispose(a); R.secs.shift(); window.scrollTo(0, y0 - h); }
      else { dispose(b); R.secs.pop(); }
    }
    syncEnd();
  } catch (e) { console.error(e); toast('Không tải được chương kế: ' + (e.message || e)); }
  finally { if (gen === R.gen) R.busy = false; }
  if (changed) setTimeout(ensure, 30);
}
function syncEnd() {
  const last = R.secs[R.secs.length - 1];
  let end = flow.querySelector('.flow-end');
  if (last && last.i === R.book.chapters.length - 1) { if (!end) flow.append(el('div', { class: 'flow-end', text: 'Bạn đã đọc tới chương cuối cùng.' })); else flow.append(end); }
  else end?.remove();
}

/* ----- Chế độ lật trang -----
   Mỗi chương là một khối nhiều cột cao đúng khung đọc; mỗi cột rộng đúng một trang.
   Giữ tối đa 3 chương (trước, hiện tại, sau) xếp liền nhau trên một dải ngang,
   nên vuốt qua ranh giới chương vẫn liền mạch. */
function pgGeom() {
  const r = pgView.getBoundingClientRect();
  P.vw = r.width; P.vh = r.height;
  P.mg = Math.round(clamp(themeCfg().mg, 4, P.vw * 0.18));
  pgTrack.style.setProperty('--pgh', Math.floor(P.vh * 0.92) + 'px');
}
function measure(s) {
  const w = P.vw - 2 * P.mg, st = s.el.style;
  st.width = w + 'px'; st.height = P.vh + 'px'; st.columnWidth = w + 'px'; st.columnGap = 2 * P.mg + 'px';
  s.pages = Math.max(1, Math.round((s.el.scrollWidth + 2 * P.mg) / P.vw));
}
function place() {
  const put = (s, off) => { s.el.style.left = off * P.vw + P.mg + 'px'; };
  if (!P.cur) return;
  put(P.cur, 0); if (P.prev) put(P.prev, -P.prev.pages); if (P.next) put(P.next, P.cur.pages);
}
function setTrack(pos, anim, dx = 0) {
  pgTrack.style.transition = anim ? 'transform .3s cubic-bezier(.25,.8,.25,1)' : 'none';
  pgTrack.style.transform = `translate3d(${(-pos * P.vw + dx).toFixed(2)}px,0,0)`;
}
function addPg(s) {
  s.el.classList.add('pg-chap');
  for (const img of s.el.querySelectorAll('img')) {
    if (img.dataset.src && !img.getAttribute('src')) img.src = img.dataset.src;
    if (!img.complete) img.addEventListener('load', relayoutSoon, { once: true });
  }
  pgTrack.append(s.el);
}
function clearPager() {
  for (const s of [P.prev, P.cur, P.next]) if (s) dispose(s);
  P.prev = P.cur = P.next = null; P.anim = false; P.tok++; pgTrack.replaceChildren();
  pgView.style.opacity = '';
}
async function pageJump(i, frac) {
  const gen = ++R.gen; R.busy = true;
  try {
    const s = await buildSection(i);
    if (gen !== R.gen) { dispose(s); return; }
    clearPager(); addPg(s); P.cur = s; pgGeom(); measure(s);
    P.page = clamp(Math.floor(frac * s.pages + 1e-6), 0, s.pages - 1);
    place(); setTrack(P.page, false);
  } catch (e) { toast('Không mở được chương: ' + (e.message || e)); }
  finally { if (gen === R.gen) R.busy = false; }
  updateBars(); pgNeighbors();
}
async function pgNeighbors() {
  if (R.mode !== 'page' || !P.cur || P.loading === R.gen) return;
  const gen = R.gen; P.loading = gen;
  try {
    for (;;) {
      if (gen !== R.gen || !P.cur) return;
      const n = R.book.chapters.length;
      let side = null;
      if (!P.next && P.cur.i + 1 < n) side = 'next'; else if (!P.prev && P.cur.i > 0) side = 'prev';
      if (!side) return;
      const want = side === 'next' ? P.cur.i + 1 : P.cur.i - 1;
      const s = await buildSection(want);
      if (gen !== R.gen || !P.cur || P[side] || (side === 'next' ? P.cur.i + 1 : P.cur.i - 1) !== s.i) { dispose(s); continue; }
      addPg(s); measure(s); P[side] = s; place();
    }
  } catch (e) { console.error(e); }
  finally { if (P.loading === gen) P.loading = 0; }
}
function turn(dir) {
  if (!P.cur || P.anim) return;
  if (R.chrome) setChrome(false);
  const pos = P.page + dir;
  if (pos >= P.cur.pages && !P.next) { toast(P.cur.i + 1 >= R.book.chapters.length ? 'Bạn đã đọc tới trang cuối cùng.' : 'Đang tải chương sau…'); pgNeighbors(); snapBack(); return; }
  if (pos < 0 && !P.prev) { if (P.cur.i > 0) { toast('Đang tải chương trước…'); pgNeighbors(); } snapBack(); return; }
  goPos(pos);
}
function goPos(pos) {
  P.anim = true;
  const tok = ++P.tok;
  const done = () => { if (tok !== P.tok || !P.anim) return; P.anim = false; settle(pos); };
  if (S.mode === 'fade') {
    pgView.style.transition = 'opacity .13s ease'; pgView.style.opacity = '0';
    setTimeout(() => { if (tok !== P.tok) return; setTrack(pos, false); pgView.style.opacity = '1'; setTimeout(done, 130); }, 130);

  else { setTrack(pos, true); const t = setTimeout(done, 400); pgTrack.addEventListener('transitionend', () => { clearTimeout(t); done(); }, { once: true }); }
}
function settle(pos) {

  } else if (pos < 0 && P.prev) {
    if (P.next) dispose(P.next);
    P.next = P.cur; P.cur = P.prev; P.prev = null; P.page = clamp(P.cur.pages + pos, 0, P.cur.pages - 1);
  } else P.page = clamp(pos, 0, P.cur.pages - 1);

}
function snapBack() { if (P.cur) setTrack(P.page, S.mode === 'slide'); }
let relayT;
function relayoutSoon() { clearTimeout(relayT); relayT = setTimeout(relayout, 80); }
function relayout() {
  if (R.mode !== 'page' || !P.cur) return;
  if (P.anim) { relayoutSoon(); return; }
  const frac = P.page / P.cur.pages;
  pgGeom(); for (const s of [P.prev, P.cur, P.next]) if (s) measure(s);
  P.page = clamp(Math.floor(frac * P.cur.pages + 1e-6), 0, P.cur.pages - 1);
  place(); setTrack(P.page, false); updateBars();
}
/* Vuốt, chạm hai bên mép, cuộn chuột, phím mũi tên */
let drag = null;
pgView.addEventListener('pointerdown', e => {
  if (!P.cur || (e.pointerType === 'mouse' && e.button !== 0)) return;
  drag = { x: e.clientX, y: e.clientY, t: performance.now(), dx: 0, on: false, id: e.pointerId };
});
pgView.addEventListener('pointermove', e => {
  if (!drag || P.anim) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.on) {
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    drag.on = true; try { pgView.setPointerCapture(drag.id); } catch {}
    if (R.chrome) setChrome(false);
  }
  drag.dx = dx;
  if (S.mode === 'slide') {
    const stuck = (dx > 0 && P.page === 0 && !P.prev) || (dx < 0 && P.page === P.cur.pages - 1 && !P.next);
    setTrack(P.page, false, stuck ? dx / 3 : dx);
  }

pgView.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.on) {
    const v = d.dx / Math.max(1, performance.now() - d.t);
    const dir = d.dx < -P.vw * 0.18 || v < -0.45 ? 1 : d.dx > P.vw * 0.18 || v > 0.45 ? -1 : 0;
    if (dir) turn(dir); else snapBack();
    return;
  }
  if (Math.abs(e.clientX - d.x) > 10 || Math.abs(e.clientY - d.y) > 10) return;
  const a = e.target.closest?.('[data-target]');
  if (a) { followLink(a); return; }
  const x = e.clientX - pgView.getBoundingClientRect().left;
  if (x < P.vw * 0.28) turn(-1); else if (x > P.vw * 0.72) turn(1); else setChrome(!R.chrome);
});
pgView.addEventListener('pointercancel', () => { if (drag?.on) snapBack(); drag = null; });
let wheelT = 0;
pgView.addEventListener('wheel', e => {
  e.preventDefault();
  const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(d) < 12 || Date.now() - wheelT < 380) return;
  wheelT = Date.now(); turn(d > 0 ? 1 : -1);
}, { passive: false });
document.addEventListener('keydown', e => {
  if (!R.book || reader.hidden) return;
  if (e.key === 'Escape') { if (!rs.hidden) closeLook(); else if (!$('#r-menu').hidden) closeMenu(); else if (!$('#sheet').hidden) closeSheet(); return; }
  if (R.mode !== 'page' || !rs.hidden || !$('#sheet').hidden || e.target.closest?.('input,textarea')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); turn(1); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); turn(-1); }
});
function followLink(a) { const t = a.dataset.target; const idx = R.book.chapters.findIndex(c => c.entries?.includes(t)); if (idx >= 0) jumpTo(idx, 0); }

/* ----- Vị trí đọc, thanh tiến độ ----- */
function readPos() {
  if (!R.book) return null;

  const s = currentSec(); if (!s) return null;

}
const fill = inp => inp.style.setProperty('--fill', (inp.value - inp.min) / ((inp.max - inp.min) || 1) * 100 + '%');

    $('#pg-head').textContent = ch.title;
    $('#pg-foot').textContent = `${P.page + 1} / ${P.cur.pages}`;
  } else $('#r-label').textContent = ch.title;

}

let ticking = false;
window.addEventListener('scroll', () => {

function setChrome(on) { R.chrome = on; R.lastY = window.scrollY; reader.classList.toggle('chrome-off', !on); if (!on) closeMenu(); }

  if (!R.book) return;
  if (R.mode === 'page') { relayoutSoon(); return; }
  const p = R.pos || readPos(); clearTimeout(resizeT);
  resizeT = setTimeout(() => { if (!p) return; const s = R.secs.find(x => x.i === p.i); if (s) window.scrollTo(0, absTop(s.el) + p.frac * s.el.getBoundingClientRect().height); }, 120);
});

/* ----- Menu “…” ----- */
function openMenu() {
  const m = $('#r-menu'); if (!m.hidden) { closeMenu(); return; }
  const p = readPos(), n = R.book.chapters.length;
  const item = (label, icon, fn, off) => el('button', { type: 'button', disabled: off ? '' : null, onclick: () => { closeMenu(); fn(); } }, el('span', { text: label }), el('span', { class: 'mi', html: icon }));
  m.replaceChildren(
    item('Mục lục', ICON.list, openToc),
    R.book.kind !== 'comic' ? item('Giao diện & Cài đặt', '<b class="mi-aa">Aa</b>', openLook) : null,
    item('Về đầu chương', ICON.top, toChapStart),
    item('Chương trước', ICON.prev, () => jumpTo(p.i - 1, 0), !p || p.i === 0),
    item('Chương sau', ICON.next, () => jumpTo(p.i + 1, 0), !p || p.i >= n - 1));
  m.hidden = false;
  setTimeout(() => document.addEventListener('pointerdown', menuAway, true));
}
function menuAway(e) { if (!$('#r-menu').contains(e.target) && !$('#r-more').contains(e.target)) closeMenu(); }
function closeMenu() { $('#r-menu').hidden = true; document.removeEventListener('pointerdown', menuAway, true); }

/* ----- Bảng Giao diện & Cài đặt ----- */
function keepPlace(fn) {
  if (R.mode === 'page') { fn(); relayout(); return; }
  const p = readPos(); fn();
  if (p) { const s = R.secs.find(x => x.i === p.i); if (s) window.scrollTo(0, absTop(s.el) + p.frac * s.el.getBoundingClientRect().height); }
}
let draft = null;
const MODES = [['scroll', 'Cuộn dọc'], ['slide', 'Lật trang – trượt'], ['fade', 'Lật trang – mờ dần'], ['none', 'Lật trang – tức thì']];
const LOOKS = [['auto', 'Tự động theo máy'], ['light', 'Luôn sáng'], ['dark', 'Luôn tối']];
const panel = (...kids) => el('div', { class: 'rs-panel', role: 'dialog', 'aria-modal': 'true' }, ...kids);
function openLook() { if (!R.book || R.book.kind === 'comic') return; closeMenu(); rs.hidden = false; rs.onclick = e => { if (e.target === rs) closeLook(); }; lookMain(); }
function closeLook() { rs.hidden = true; rs.replaceChildren(); draft = null; }
function sw(on, change) {
  const b = el('button', { type: 'button', class: 'sw', role: 'switch' });
  const set = v => { b.classList.toggle('on', !!v); b.setAttribute('aria-checked', String(!!v)); };
  set(on); b.addEventListener('click', () => { const v = !b.classList.contains('on'); set(v); change(v); });
  return { el: b, set };
}
function popover(anchor, items, cur, pick) {
  const pn = anchor.closest('.rs-panel'); pn.querySelector('.rs-pop')?.remove();
  const pop = el('div', { class: 'rs-pop', role: 'menu' });
  for (const [v, label] of items) pop.append(el('button', { type: 'button', role: 'menuitemradio', 'aria-checked': String(v === cur), onclick: e => { e.stopPropagation(); pop.remove(); pick(v); } }, el('span', { class: 'ck', html: v === cur ? ICON.check : '' }), el('span', { text: label })));
  const pr = pn.getBoundingClientRect(), br = anchor.getBoundingClientRect();
  pop.style.top = br.bottom - pr.top + pn.scrollTop + 8 + 'px';
  pop.style.right = Math.max(8, pr.right - br.right - 4) + 'px';
  pn.append(pop);
  const away = ev => { if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('pointerdown', away, true); } };
  setTimeout(() => document.addEventListener('pointerdown', away, true));
}
function lookMain() {
  const fsBtn = (cls, d, label) => el('button', { type: 'button', class: cls, text: 'A', 'aria-label': label, onclick: () => keepPlace(() => { S.fs = clamp(S.fs + d, 12, 36); applySettings(); }) });
  const modeBtn = el('button', { type: 'button', 'aria-label': 'Kiểu đọc: cuộn dọc hoặc lật trang', html: S.mode === 'scroll' ? ICON.scroll : ICON.page });
  modeBtn.onclick = () => popover(modeBtn, MODES, S.mode, v => { setReadMode(v); lookMain(); });
  const lookBtn = el('button', { type: 'button', 'aria-label': 'Sáng hoặc tối', html: ICON.sunset });
  lookBtn.onclick = () => popover(lookBtn, LOOKS, S.appearance, v => { S.appearance = v; keepPlace(applySettings); lookMain(); });
  const br = el('input', { type: 'range', class: 'rg', min: 0, max: 100, step: 1, value: Math.round((1 - S.dim) * 100), 'aria-label': 'Độ sáng màn hình đọc' });
  br.addEventListener('input', () => { S.dim = 1 - br.value / 100; fill(br); applySettings(); }); fill(br);
  const grid = el('div', { class: 'tgrid' });
  for (const t of THEMES) {
    const c = themeCfg(t.id), p = palette(t.id);
    grid.append(el('button', { type: 'button', class: 'tcard' + (t.id === S.theme ? ' on' : ''), 'aria-pressed': String(t.id === S.theme),
      style: `--tbg:${p.bg};--tink:${p.ink};font-family:${fontStack(c.font)};font-weight:${c.bold ? 700 : 400}`,
      onclick: () => { keepPlace(() => { S.theme = t.id; applySettings(); }); lookMain(); } },
      el('b', { text: 'Aa' }), el('span', { text: t.name }), Object.keys(S.over[t.id] || {}).length ? el('sup', { text: '*' }) : null));
  }
  rs.replaceChildren(panel(
    el('div', { class: 'rs-head' }, el('button', { type: 'button', class: 'rs-x', 'aria-label': 'Đóng', html: ICON.x, onclick: closeLook }), el('h3', { text: 'Giao diện & Cài đặt' })),
    el('div', { class: 'rs-row' },
      el('div', { class: 'pill' }, fsBtn('a-sm', -1, 'Chữ nhỏ hơn'), fsBtn('a-lg', 1, 'Chữ lớn hơn')),
      el('div', { class: 'pill' }, modeBtn, lookBtn)),
    el('div', { class: 'rs-bright' }, el('span', { html: ICON.sun }), br, el('span', { class: 'big', html: ICON.sun })),
    grid,
    el('button', { type: 'button', class: 'rs-wide', onclick: () => lookCustom(true) }, el('span', { html: ICON.gear }), el('span', { text: 'Tuỳ chỉnh' }))));
}
function sampleText() {
  const node = R.mode === 'page' ? P.cur?.el : currentSec()?.el;
  const txt = [...(node?.querySelectorAll('.content p, .content div') || [])].map(x => x.textContent).join(' ').replace(/\s+/g, ' ').trim();
  return txt.slice(0, 260) || 'Đêm ấy trăng sáng vằng vặc, gió thổi qua rặng tre nghe xào xạc. Nàng khẽ mở cuốn sách cũ, lật từng trang giấy đã ngả màu.';
}
function lookCustom(fresh) {
  if (fresh || !draft) draft = JSON.parse(JSON.stringify(S.over[S.theme] || {}));
  const t = themeOf(S.theme);
  const val = k => draft.custom && draft[k] != null ? draft[k] : t[k];
  const top = el('div', { class: 'rs-top' });
  const upd = () => setVars(top, styleVars(S.theme, draft));
  const sliders = [];
  const slider = (k, label, min, max, step, fmt) => {
    const out = el('span', { class: 'sl-val', text: fmt(val(k)) });
    const inp = el('input', { type: 'range', class: 'rg', min, max, step, value: val(k), 'aria-label': label });
    inp.disabled = !draft.custom;
    inp.addEventListener('input', () => { draft[k] = +inp.value; out.textContent = fmt(+inp.value); fill(inp); upd(); });
    fill(inp); sliders.push({ inp, out, k, fmt });
    return el('div', { class: 'sl' }, el('div', { class: 'sl-label', text: label }), el('div', { class: 'sl-row' }, inp, out));
  };
  const pct = v => Math.round(v) + '%';
  const layout = el('div', { class: 'rs-group' + (draft.custom ? '' : ' off') });
  const just = sw(val('justify'), v => { draft.justify = v; upd(); });
  just.el.disabled = !draft.custom;
  const custom = sw(!!draft.custom, on => {
    draft.custom = on;
    if (on) for (const k of LAYOUT) if (draft[k] == null) draft[k] = t[k];
    for (const s of sliders) { s.inp.disabled = !on; s.inp.value = val(s.k); s.out.textContent = s.fmt(val(s.k)); fill(s.inp); }
    just.set(val('justify')); just.el.disabled = !on; layout.classList.toggle('off', !on); upd();
  });
  layout.append(
    el('div', { class: 'rs-item' }, el('span', { text: 'Tuỳ chỉnh bố cục' }), custom.el),
    slider('lh', 'Giãn dòng', 1, 2.6, 0.05, v => (+v).toFixed(2).replace('.', ',')),
    slider('ls', 'Khoảng cách ký tự', 0, 15, 1, pct),
    slider('ws', 'Khoảng cách từ', 0, 50, 1, pct),
    slider('mg', 'Lề hai bên', 4, 64, 2, v => v + ' px'),
    el('div', { class: 'rs-item' }, el('span', { text: 'Căn đều hai bên' }), just.el));
  const bold = sw(draft.bold ?? t.bold, v => { draft.bold = v; upd(); });
  const fid = draft.font || t.font;
  top.append(
    el('div', { class: 'rs-head' },
      el('button', { type: 'button', class: 'rs-x', 'aria-label': 'Huỷ thay đổi', html: ICON.x, onclick: () => { draft = null; lookMain(); } }),
      el('h3', { text: `Tuỳ chỉnh “${t.name}”` }),
      el('button', { type: 'button', class: 'rs-x ok', 'aria-label': 'Lưu', html: ICON.check, onclick: saveDraft })),
    el('div', { class: 'pv' }, el('div', { class: 'pv-aa', text: 'Aa' }), el('p', { class: 'pv-text', text: sampleText() })));
  upd();
  rs.replaceChildren(panel(top,
    el('div', { class: 'rs-sec' }, el('h4', { text: 'Chữ' }), el('div', { class: 'rs-group' },
      el('button', { type: 'button', class: 'rs-item', onclick: lookFonts }, el('span', { class: 'ic', text: 'Aa' }), el('span', { text: 'Phông chữ' }),
        el('span', { class: 'v', text: (FONTS.find(f => f[0] === fid) || FONTS[4])[1], style: `font-family:${fontStack(fid)}` }), el('span', { class: 'chev', html: ICON.chev })),
      el('div', { class: 'rs-item' }, el('span', { class: 'ic', html: '<b>B</b>' }), el('span', { text: 'Chữ đậm' }), bold.el))),
    el('div', { class: 'rs-sec' }, el('h4', { text: 'Bố cục & dễ đọc' }), layout),
    el('button', { type: 'button', class: 'rs-link', text: 'Khôi phục mặc định của chủ đề này', onclick: () => { draft = {}; lookCustom(false); } })));
}
function saveDraft() {
  const t = themeOf(S.theme), d = draft || {};
  if (!d.custom) { delete d.custom; LAYOUT.forEach(k => delete d[k]); }
  if (!d.font || d.font === t.font) delete d.font;
  if (d.bold == null || d.bold === t.bold) delete d.bold;
  if (Object.keys(d).length) S.over[S.theme] = d; else delete S.over[S.theme];
  draft = null; keepPlace(applySettings); lookMain();
}
function lookFonts() {
  const t = themeOf(S.theme), cur = draft.font || t.font;
  const list = el('div', { class: 'rs-group' });
  for (const [id, name, stack] of FONTS) list.append(el('button', { type: 'button', class: 'rs-item', style: `font-family:${stack}`, onclick: () => { draft.font = id; lookCustom(false); } },
    el('span', { text: name + (id === t.font ? ' (mặc định)' : '') }), el('span', { class: 'ck', html: id === cur ? ICON.check : '' })));
  rs.replaceChildren(panel(
    el('div', { class: 'rs-head' }, el('button', { type: 'button', class: 'rs-x', 'aria-label': 'Quay lại', html: ICON.back, onclick: () => lookCustom(false) }), el('h3', { text: 'Phông chữ' })),
    list,
    el('p', { class: 'rs-note', text: 'Phông nào máy không có sẽ được thay bằng phông gần giống. Nếu thấy dấu tiếng Việt bị lệch phông, hãy chọn phông khác.' })));
}

/* ---------------- Bảng trượt, lớp phủ, thông báo ---------------- */
function openSheet(title, build, closeLabel = 'Đóng') {
  const wrap = $('#sheet');
  const body = el('div', { class: 'sheet-body' });
  const card = el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    el('div', { class: 'sheet-head' }, el('h3', { text: title }), el('button', { type: 'button', text: closeLabel, onclick: closeSheet })), body);
  wrap.replaceChildren(card); build(body); wrap.hidden = false;
  wrap.onclick = e => { if (e.target === wrap) closeSheet(); };
}
function closeSheet() { const w = $('#sheet'); w.hidden = true; w.replaceChildren(); }
function showOverlay(t) { $('#ov-title').textContent = t; $('#ov-bar').style.width = '0'; $('#ov-sub').textContent = ''; $('#overlay').hidden = false; }
function updateOverlay(f, sub) { $('#ov-bar').style.width = (f * 100).toFixed(1) + '%'; $('#ov-sub').textContent = sub; }
function hideOverlay() { $('#overlay').hidden = true; }
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3200); }

/* ---------------- Khởi động ---------------- */
document.body.classList.add('in-lib');
document.addEventListener('click', e => { const b = e.target.closest('[data-close-note]'); if (b) { const n = b.closest('.note'); n.hidden = true; lsSet('kt-hide-' + n.id, 1); } });
const inFrame = (() => { try { return window.self !== window.top; } catch { return true; } })();
const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const hasManifest = !!document.querySelector('link[rel="manifest"]');
if (hasManifest && !standalone && /iPhone|iPad|iPod/.test(navigator.userAgent) && !lsGet('kt-hide-install-note', 0)) $('#install-note').hidden = false;
if (inFrame && !lsGet('kt-hide-frame-note', 0)) $('#frame-note').hidden = false;
if (hasManifest && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
renderLibrary();
})();
</script>
